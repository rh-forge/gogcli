name: cleanup-pr-image

# Delete the pr-<number> image tag once its pull request closes, so PR
# builds do not pile up in billed GHCR storage. The sha-* / semver / latest
# tags published from the default branch are never touched -- PR pushes only
# ever create pr-<number>.
#
# pull_request_target rather than pull_request because fork PRs get a
# read-only GITHUB_TOKEN on pull_request, which cannot delete package
# versions. pull_request_target is safe here because this workflow never
# checks out or executes PR code.

on:
  pull_request_target:
    types: [closed]

permissions:
  packages: write

jobs:
  delete:
    runs-on: ubuntu-latest
    env:
      # Keep in step with the image matrix in the publish-image workflow.
      IMAGES: gog
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.number }}
    steps:
      - name: Delete pr-${{ github.event.number }} package versions
        run: |
          for image in $IMAGES; do
            ids=$(gh api "orgs/${{ github.repository_owner }}/packages/container/${image}/versions" \
              --paginate \
              --jq ".[] | select(.metadata.container.tags[]? == \"pr-${PR_NUMBER}\") | .id")
            if [ -z "$ids" ]; then
              echo "No pr-${PR_NUMBER} version of ${image} to delete."
              continue
            fi
            for id in $ids; do
              echo "Deleting ${image} version ${id} (pr-${PR_NUMBER})"
              gh api --method DELETE \
                "orgs/${{ github.repository_owner }}/packages/container/${image}/versions/${id}"
            done
          done
